appId: com.janherman.foundation
productName: Foundation
copyright: Copyright © 2026 Jan-Herman Schlechter

directories:
  output: dist
  buildResources: src/assets

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!tools/**"

# Keep asar on. If you add a native module (.node) or files fetched by URL at
# runtime, they cannot be read from inside the archive - add an asarUnpack entry
# for those paths rather than turning asar off wholesale.
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/assets/icon-512.png
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Foundation
  runAfterFinish: true
