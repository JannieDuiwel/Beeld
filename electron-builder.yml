appId: com.janherman.beeld
productName: Beeld
copyright: Copyright © 2026 Jan-Herman Schlechter

directories:
  output: dist
  buildResources: src/assets

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!tools/**"

# Nothing native to unpack: every backend is reached over HTTP, and the only
# image processing is Electron's own nativeImage. That is the whole reason this
# app installs cleanly where Vloei needed koffi and ONNX carve-outs.
asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/assets/icon-512.png
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Beeld
  runAfterFinish: true
