appId: com.janherman.beeld
productName: Beeld
copyright: Copyright © 2026 Jan-Herman Schlechter

directories:
  output: dist
  buildResources: src/assets

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!tools/**"
  # The skeleton is a sibling project kept in this repo, not part of the app.
  - "!foundation/**"
  - "!mcp/**"

# sharp (pixelate / cut-out / spritesheets) is the one native module. Its .node
# binaries cannot load from inside an asar, so they are unpacked next to it.
asar: true
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"

# Auto-update feed. `npm run release` (needs GH_TOKEN) uploads the installer and
# latest.yml to a GitHub Release; installed copies check it on launch. The repo
# must be public, or the app would need a token baked in.
publish:
  provider: github
  owner: JannieDuiwel
  repo: Beeld

win:
  target:
    - target: nsis
      arch: [x64]
  icon: src/assets/icon-512.png
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Beeld
  runAfterFinish: true
